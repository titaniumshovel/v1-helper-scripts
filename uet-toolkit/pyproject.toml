[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uet"
version = "0.1.0"
description = "Unmanaged Endpoints Toolkit for Vision One Server & Workload Protection"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
ssm = ["boto3>=1.26"]
winrm = ["pywinrm>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
uet = "uet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
